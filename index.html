<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONTAP 儲存架構與資料保護</title>
<meta name="description" content="以三維模型互動導覽 NetApp ONTAP：disk、local tier、node 與 HA pair、cluster、SVM、LIF、volume、qtree／LUN，以及 Snapshot、SnapMirror 資料保護與異地復原流程。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Inter","Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
  --bg:#FFFFFF; --ink:#0A0A0A; --ink2:#4B4F54; --ink3:#868B91;
  --rule:rgba(10,10,10,.12); --btn:rgba(255,255,255,.85); --card:#F4F6F9;
  --brand:#0067C5; --brand2:#00A3E0; --on-brand:#FFFFFF;
  --ok:#00A39B; --bad:#D9363E; --focus:#0067C5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --ink:#F2F4F7; --ink2:#AEB6C2; --ink3:#77808E;
    --rule:rgba(242,244,247,.14); --btn:rgba(18,27,45,.85); --card:rgba(255,255,255,.05);
    --brand:#3D8EF0; --focus:#3D8EF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --ink:#F2F4F7; --ink2:#AEB6C2; --ink3:#77808E;
  --rule:rgba(242,244,247,.14); --btn:rgba(18,27,45,.85); --card:rgba(255,255,255,.05);
  --brand:#3D8EF0; --focus:#3D8EF0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;touch-action:none}
/* 桌面版 3D 只佔文字卡右側，內容不會蓋到模型；標籤超出範圍就裁掉 */
/* 寬度不到 1024px 時 3D 區太窄、標籤放不下，改用上下排列的版面 */
@media (min-width:1024px){
  #stage{left:calc(80px + var(--cw));overflow:hidden}
  /* 長章節往上捲時，文字在頂部標題列下方淡出，不和標題重疊 */
  #panel{-webkit-mask-image:linear-gradient(to bottom,transparent 84px,#000 124px);mask-image:linear-gradient(to bottom,transparent 84px,#000 124px)}
}
.labels{position:absolute;inset:0;pointer-events:none}
.veil{display:none;
  background:linear-gradient(90deg,var(--bg) 0,var(--bg) 380px,transparent 620px);opacity:.92;transition:background .4s}

/* 3D labels */
.lbl{pointer-events:none;white-space:nowrap;transition:opacity .2s}
.lbl .in{display:flex;align-items:baseline;gap:6px;transform:translateX(50%);font-size:13px;font-weight:500;color:var(--ink)}
.lbl.left .in{transform:translateX(-50%);flex-direction:row-reverse}
.lbl b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--c);letter-spacing:.04em}
.lbl i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.lbl.sm .in{font-size:12px}
.lbl.center .in{transform:none}
.lbl.title.mid .in{transform:translateX(-50%)}
.lbl.title .in{transform:none;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink);padding:3px 8px;border:1px solid var(--rule);border-left:3px solid var(--brand);background:var(--btn);border-radius:0}
.lbl.tag .in{transform:none;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:2px;background:var(--brand);color:var(--on-brand)}
.lbl.warn .in{transform:none;font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--bad);color:#fff}

/* header */
#top{position:fixed;left:56px;right:40px;top:28px;height:44px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.06em;color:var(--ink2)}
.brand b{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:10px}
.brand b::before{content:"";width:14px;height:14px;background:var(--brand)}
.brand .div{width:1px;height:22px;background:var(--rule)}
.ctl{display:flex;gap:8px}
.ctl button,#tools button,#bar button,.btn{border:1px solid var(--rule);background:var(--btn);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:2px;padding:7px 14px;font-size:13px;font-weight:500;transition:background .2s,border-color .2s}
.ctl button:hover,#tools button:hover,#bar button:hover,.btn:hover{border-color:var(--brand);color:var(--brand)}
.ctl button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#tools{position:fixed;right:40px;top:84px;z-index:3;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3)}
#tools .zoom{display:flex;align-items:center;gap:6px;color:var(--ink2);font-family:var(--mono);font-size:14px}
#zoom{width:120px;accent-color:var(--brand);cursor:pointer}

/* panel */
/* 面板蓋滿畫面、只有左側文字卡可點，其餘的點擊與拖曳穿透到 3D */
#panel{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;overflow-anchor:none;scrollbar-width:none;pointer-events:none}
#panel::-webkit-scrollbar{display:none}
.pg{min-height:100%;padding:124px 56px 108px;display:flex;flex-direction:column;opacity:.28;transition:opacity .45s}
.pg.on{opacity:1}
/* 縮放橫軸 --z：3D 放大時文字欄變窄、縮小時變寬 */
/* 縮小模型時文字欄變寬，但最多寬到 3D 區還剩 520px，否則右側標籤會因為 3D 區太窄而超出；不影響預設寬度 */
:root{--z:0;--cw0:min(600px, 46vw - 56px);--cw:min(calc(var(--cw0) * (1 - .2 * var(--z))), max(var(--cw0), calc(100vw - 600px)));--sh:calc(44svh + 10svh * var(--z))}
.blk{width:var(--cw);max-width:100%;pointer-events:auto;padding:4px 28px 28px;border-radius:4px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* 捲動進場：各區塊依序由下浮上（參考 animejs.com） */
.blk>*{opacity:0;transform:translateY(28px);transition:opacity .6s,transform .9s cubic-bezier(.16,.8,.24,1)}
.pg.seen .blk>*{opacity:1;transform:none}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin-top:28px}
.eyebrow .num{font-family:var(--mono);font-size:12px;color:var(--on-brand);background:var(--brand);border-radius:2px;padding:1px 6px}
.eyebrow .sep{flex:0 0 18px;height:1px;background:var(--rule)}
h1{font-size:54px;line-height:1.12;font-weight:700;letter-spacing:.02em;margin:22px 0 18px}
h2{font-size:34px;line-height:1.25;font-weight:700;letter-spacing:.02em;margin:18px 0 14px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
h2 em{font-style:normal;font-weight:400;font-size:16px;color:var(--ink3)}
h2 .badge{font-family:var(--mono);font-size:14px;font-weight:500;color:#fff;background:var(--c,var(--ink));border-radius:2px;padding:3px 8px;align-self:center}
h3{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--ink);margin:24px 0 10px;padding-left:10px;border-left:3px solid var(--brand)}
.lede{font-size:16px;line-height:1.85;color:var(--ink2);margin:0 0 20px;font-weight:300}
.lede b{color:var(--ink);font-weight:500}
.hint{font-size:13px;color:var(--ink3);line-height:1.7;margin-top:28px}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:26px;border-top:1px solid var(--rule);padding-top:12px}

.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;border-top:2px solid var(--brand);padding-top:14px}
.figs.three{grid-template-columns:repeat(3,1fr);gap:0 16px}
.fig .n{font-size:38px;font-weight:700;line-height:1.1;color:var(--brand)}
.fig .n small{font-family:var(--sans);font-size:14px;margin-left:3px;color:var(--ink2)}
.fig .k{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.5}
.fig .v{font-size:14.5px;line-height:1.5;margin-top:4px;color:var(--ink);overflow-wrap:anywhere}
.fig .v.cli{font-family:var(--mono);font-size:12.5px}

ul.does{list-style:none;margin:0;padding:0}
ul.does li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--rule);font-size:14.5px;line-height:1.65;color:var(--ink)}
ul.does li::before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:2px;border:1px solid var(--rule);background:var(--card)}
.analogy{margin-top:22px;padding:14px 16px;border-left:3px solid var(--c);background:var(--card);border-radius:0}
.analogy .k{font-size:12px;letter-spacing:.08em;color:var(--ink3)}
.analogy p{margin:6px 0 0;font-size:15px;line-height:1.75}

/* overview rows */
.stack{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 4px;transition:background .2s,padding .25s}
.row:hover,.row.hl{background:var(--card);padding-left:10px}
.row .L{font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;background:var(--c);border-radius:2px;text-align:center;padding:2px 0}
.row .nm{font-size:15px;font-weight:600}
.row .nm small{display:block;font-size:12.5px;font-weight:400;color:var(--ink3);margin-top:2px}
.row .cli-s{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.group-tag{font-size:11.5px;font-weight:600;color:var(--brand);letter-spacing:.08em;margin:14px 0 6px}

/* flow */
.fl-now{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.fl-now .stepn{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.fl-now .stept{font-size:22px;font-weight:500}
.nvs{display:flex;gap:8px;flex-wrap:wrap}
.nv{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:2px;border:1px solid var(--rule);color:var(--ink3);transition:background .3s,color .3s}
.nv.lit{background:#D99A1E;border-color:#D99A1E;color:#fff}
.nv.down{background:var(--bad);border-color:var(--bad);color:#fff}
.fl-note{font-size:15px;line-height:1.8;margin-top:16px;min-height:5.4em}
/* 流程章：每一步一段，捲到哪一段就演到哪一步 */
.fstep{min-height:46vh;padding:18px 0 0 16px;border-left:2px solid var(--rule);opacity:.3;transition:opacity .4s,border-color .4s}
.fstep.on{opacity:1;border-left-color:var(--brand)}
.fstep .fl-now{margin-top:0}
.fstep .fl-note{min-height:0}
/* 3D 裡跟著流程移動的步驟卡 */
.lbl.call .in{transform:translate(calc(-50% + var(--dx,0px)),calc(-100% + var(--dy,0px)));display:block;font-size:13px;font-weight:600;padding:6px 10px;background:var(--btn);border:1px solid var(--rule);border-top:3px solid var(--brand);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink)}
.lbl.call .in b{font-family:var(--mono);font-size:11px;color:var(--brand);margin-right:6px}

/* compare */
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-size:12px;font-weight:700;color:var(--ink);text-align:left;padding:6px 6px 6px 0;border-bottom:2px solid var(--brand)}
.cmp td{padding:11px 6px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
.cmp td:first-child{color:var(--ink3);font-size:12.5px;white-space:nowrap}

/* quiz */
.qcard{border:1px solid var(--rule);border-top:3px solid var(--brand);background:var(--card);border-radius:0;padding:16px 18px}
.qcard .qn{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.qcard p{font-size:17px;line-height:1.7;margin:8px 0 0}
.qbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.qbtns button{border:1px solid var(--rule);background:var(--btn);border-radius:2px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,border-color .2s,background .2s;min-width:0}
.qbtns button b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--c)}
.qbtns button span{font-size:11px;color:var(--ink2);white-space:nowrap}
.qbtns button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
.qbtns button:disabled{cursor:default}
.qbtns button.right{background:var(--c);border-color:var(--c)}
.qbtns button.right b,.qbtns button.right span{color:#fff}
.qbtns button.wrong{border-color:var(--bad);border-style:dashed;opacity:.8}
.fb{min-height:5.2em;font-size:14.5px;line-height:1.75;margin-top:14px}
.fb .res{font-weight:500}
.fb .res.ok{color:var(--ok)} .fb .res.no{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--ink2)}

/* bottom bar */
/* 右下角時間軸：深色膠囊加上跟著捲動位置移動的播放頭（參考 animejs.com） */
#bar{position:fixed;right:40px;bottom:28px;height:44px;z-index:3;display:flex;align-items:center;gap:4px;padding:0 6px;background:#1B1E23;color:#E8EAED;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#bar #bPrev,#bar #bNext{width:32px;height:32px;padding:0;display:grid;place-items:center;background:none;border-color:transparent;color:inherit;backdrop-filter:none;-webkit-backdrop-filter:none}
#bar #bPrev:hover,#bar #bNext:hover{color:#fff;background:rgba(255,255,255,.1)}
#ticks{display:flex;gap:2px;align-items:center;position:relative;height:100%}
#ticks button{border:0;background:none;padding:14px 4px 10px;font-family:var(--mono);font-size:10.5px;color:rgba(232,234,237,.45);position:relative;border-radius:0}
#ticks button::after{content:"";position:absolute;left:50%;top:6px;width:1px;height:5px;background:rgba(232,234,237,.3)}
#ticks button.on{color:#fff;font-weight:500}
#ticks button:hover{color:#fff}
#head{position:absolute;left:0;top:5px;bottom:5px;width:2px;margin-left:-1px;border-radius:2px;background:var(--brand2);box-shadow:0 0 8px var(--brand2);pointer-events:none;will-change:transform}
#curT{font-size:12.5px;color:rgba(232,234,237,.7);margin:0 8px 0 4px;white-space:nowrap}
#progress{position:fixed;left:0;top:0;height:3px;background:var(--brand);z-index:4;width:0;transition:width .25s linear}

@media (max-width:1023px){
  .veil{display:none}
  #top{left:16px;right:16px;top:10px}
  .brand span:not(.div){display:none}.brand .div{display:none}
  .ctl{gap:6px}
  .ctl button{padding:6px 8px;font-size:12px;white-space:nowrap}
  .brand b{white-space:nowrap;font-size:13px;gap:8px}
  .brand b::before{width:10px;height:10px}
  #stage{bottom:auto;height:var(--sh);top:52px}
  #tools{top:calc(52px + var(--sh) - 34px);right:16px}
  #tools span{display:none}
  #zoom{width:96px}
  #panel{left:16px;right:16px;width:auto;top:calc(52px + var(--sh));bottom:64px;border-top:1px solid var(--rule);pointer-events:auto}
  .pg{display:block;padding:0 0 48px}
  .pg+.pg{border-top:1px solid var(--rule)}
  .blk{width:auto;padding:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .eyebrow{margin-top:16px}
  h1{font-size:38px;margin:14px 0}
  h2{font-size:26px}
  .fig .n{font-size:26px}
  #bar{left:16px;right:16px;bottom:12px}
  #ticks{overflow-x:auto;scrollbar-width:none;flex:1;gap:0;justify-content:space-between}
  /* 15 個刻度要擠進手機寬度，不必左右捲動 */
  #ticks button{padding:14px 1px 10px;font-size:10px}
  #bar #bPrev,#bar #bNext{width:28px}
  #curT{display:none}
  /* 畫面窄，3D 標籤只留中文名稱 */
  .lbl i{display:none}
  /* 次要標籤（aggr1、節點 A 這類）在手機上太擠 */
  .lbl.sm{display:none}
  /* 只留目前聚焦元件的標籤，其餘看面板 */
  .lbl.main:not(.focus){display:none}
  /* 災難、break 狀態面板上已經有，手機版不在模型上重複 */
  .lbl.warn{display:none}
}
body:not([data-mode="flow"]) .lbl.nvl{display:none}
/* 聚焦單一元件時只留它的標籤 */
body[data-focus] .lbl:not(.focus):not(.call):not(.tag):not(.warn){display:none}
/* 封面、總覽、測驗這類全景畫面只留主標籤，次要標籤（aggr1、Node B、HA interconnect）收起來 */
body[data-mode="main"]:not([data-focus]) .lbl.sm{display:none}
/* 左側標籤只留主名，避免伸進文字欄 */
.lbl.left i{display:none}
@media (prefers-reduced-motion:reduce){
  .pg,.blk>*{transition:none}
  .blk>*{opacity:1;transform:none}
}
</style>

<body>
<div id="progress"></div>
<div id="stage"></div>
<div class="veil"></div>

<header id="top">
  <div class="brand"><b>ONTAP 儲存架構</b><span class="div"></span><span>NetApp 叢集互動導覽</span></div>
  <div class="ctl">
    <button id="bAuto" aria-pressed="false">▶ 自動播放</button>
    <button id="bTheme">明暗</button>
    <button id="bFull">全螢幕</button>
  </div>
</header>

<div id="tools"><span>⟲ 在模型上拖曳可旋轉視角，點選任一元件</span><label class="zoom" title="3D 縮放">－<input id="zoom" type="range" min="-1" max="1" step="0.05" value="0" aria-label="3D 模型縮放">＋</label><button id="bReset">↺ 重設視角</button></div>

<aside id="panel" aria-live="polite"></aside>

<nav id="bar" aria-label="章節">
  <button id="bPrev" aria-label="上一章">←</button>
  <div id="ticks"></div>
  <button id="bNext" aria-label="下一章">→</button>
  <div id="curT"></div>
</nav>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ───────────── 內容 ───────────── */
const U = {
  disk:{zh:'Disk',short:'Disk',en:'磁碟',color:'#6C7781',grp:'p',cli:'storage disk',
    brief:'實體儲存媒體，歸屬某個 node',
    lede:'cluster 最底層的實體儲存媒體：Flash（SSD）或容量型硬碟，裝在 disk shelf 裡。每顆 disk 都有一個<b>擁有者 node</b>，但 disk shelf 同時接到 HA pair 的兩個 node，夥伴才能在故障時接手。',
    figs:[['類型','實體資源'],['看得到的人','只有 cluster administrator'],['CLI','storage disk show']],

const edgeMats = [];
const bodyMats = []; // {m, color, mix}
const units = [];
const G = Object.fromEntries(KEYS.map(k=>[k,[]]));  // 每個元件對應的 unit（同一元件可能有 A、B 兩份）
const N = {};                                        // 依名稱找 unit，流程章用
const pickables = [];

function label(html, cls, color){
  const el = document.createElement('div');
  el.className = 'lbl '+(cls||'');
  if(color) el.style.setProperty('--c',color);
  el.innerHTML = `<div class="in">${html}</div>`;
  return {el, obj:new CSS2DObject(el)};
}
const lblHtml = k => `<b>${KEYS.indexOf(k)+1}</b><span>${U[k].zh}</span><i>${U[k].en}</i>`;
// 相同尺寸共用同一份幾何體；材質仍各自獨立，因為透明度是逐個控制
const geoCache = new Map(), edgeCache = new Map();
function boxGeo(w,h,d){
  const k = `b${w.toFixed(3)},${h.toFixed(3)},${d.toFixed(3)}`;
  if(!geoCache.has(k)) geoCache.set(k,new THREE.BoxGeometry(w,h,d));
  return geoCache.get(k);
}
function cylGeo(r,h){
  const k = `c${r.toFixed(3)},${h.toFixed(3)}`;
  if(!geoCache.has(k)) geoCache.set(k,new THREE.CylinderGeometry(r,r,h,40));
  return geoCache.get(k);
}
function edgesOf(geo){
  if(!edgeCache.has(geo)) edgeCache.set(geo,new THREE.EdgesGeometry(geo,20));
  return edgeCache.get(geo);
}
function addEdges(mesh, op=.42){
  const m = new THREE.LineBasicMaterial({color:0x161616,transparent:true,opacity:op});
  edgeMats.push(m);
  const l = new THREE.LineSegments(edgesOf(mesh.geometry),m);
  mesh.add(l); return l;
}
function smat(hex, mix, extra={}){
  const m = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.8,metalness:0,...extra});
  bodyMats.push({m,color:new THREE.Color(hex),mix});
  return m;
}
function mesh(geo, m, pos, {pick=true, edges=.42, shadow=true}={}){
  const o = new THREE.Mesh(geo,m); o.position.set(...pos);
  o.castShadow = shadow; o.receiveShadow = true; o.userData.pick = pick;
  if(edges) addEdges(o,edges);
  return o;
}
function makeUnit(root, {key=null, name='', labels=[], pop=[0,0,0]}={}){
  const u = {root, key, name, home:root.position.clone(), parts:[], labels, pop:new THREE.Vector3(...pop),
    vis:{t:1,c:1}, dim:{t:1,c:1}, off:{t:new THREE.Vector3(), c:new THREE.Vector3()}, casters:[], ems:[]};
  const seen = new Set();
  root.traverse(o=>{
    if(o.material && !seen.has(o.material)){
      seen.add(o.material);
      o.material.transparent = true; u.parts.push({m:o.material, base:o.material.opacity, tr:true});
      if(o.material.emissive && !o.material.userData.own) u.ems.push(o.material);
    }
    if(o.isMesh && o.castShadow) u.casters.push(o);
    if(o.isMesh && key && o.userData.pick){ o.userData.k = key; o.userData.u = u; pickables.push(o); }
  });
  units.push(u); scene.add(root);
  if(key) G[key].push(u);
  if(name) N[name] = u;
  return u;
}

/* 版面：拆成上下兩層。下層是實體資源（disk、local tier、node、cluster switch），

function dashed(pts, color, op=.75){
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(p=>p.isVector3?p:new THREE.Vector3(...p)));
  const m = new THREE.LineDashedMaterial({color, dashSize:.12, gapSize:.08, transparent:true, opacity:op});
  const l = new THREE.Line(g,m); l.computeLineDistances(); return l;
}
function tube(pts, r, m, pick=true){
  const c = new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const o = new THREE.Mesh(new THREE.TubeGeometry(c,32,r,8,false),m);
  o.castShadow = true; o.userData.pick = pick; return o;
}

}

/* ───────────── 狀態 ───────────── */
let cur = -1, hoverK = '', auto = false, autoAcc = 0;
const fl = {step:0};
const quiz = {i:0, answered:false, pick:'', right:0, done:0};
const FOCUS = {disk:[0,.3,.5],aggr:[0,.6,.5],node:[0,.6,-1.5],cluster:[.6,.3,-2.4],svm:[0,YL,0],lif:[0,YL,-1],vol:[0,VY,VZ],lun:[-1,VTOP,VZ],snap:[-1.9,VTOP,VZ],smir:[5,2,0]};
const RED = new THREE.Color('#D9363E'), BLACK = new THREE.Color(0);

function modeOf(ch){ return ch.kind==='flow'?'flow':ch.kind==='compare'?'cmp':'main'; }
// DR cluster 只在資料保護相關的畫面出現，其他章節不佔畫面
function drOn(){
  const ch = CH[cur];
  return (ch.kind==='unit'&&ch.k==='smir') || (ch.kind==='flow'&&!!FLOW[fl.step].dr) || (ch.kind==='quiz'&&quiz.answered&&QUIZ[quiz.i].k==='smir');
}

function computeTargets(){
  const ch = CH[cur]; const mode = modeOf(ch);
  document.body.dataset.mode = mode;
  requestRender();
  const st = FLOW[fl.step];
  const fail = mode==='flow' && st.fail;
  const qa = ch.kind==='quiz' && quiz.answered;
  const dr = drOn();
  for(const u of MAIN){
    u.vis.t = mode==='cmp' ? 0 : 1;
    if(u===siteB || u===dstU) u.vis.t = dr ? 1 : 0;
    if(u.name==='client') u.vis.t = mode==='flow' || (ch.kind==='unit'&&ch.k==='lif') ? 1 : 0;
    let dim = 1; const off = new THREE.Vector3();
    if(ch.kind==='unit'){ dim = u.key===ch.k||u.name==='client'||(ch.k==='smir'&&u===siteB)?1:.12; if(u.key===ch.k) off.copy(u.pop); }
    if(qa){ const c = QUIZ[quiz.i].k; dim = u.key===c||(c==='smir'&&u===siteB)?1:(u.key===quiz.pick?.5:.12); if(u.key===c) off.copy(u.pop); }
    if(mode==='flow') dim = st.hl.includes(u.name) ? 1 : .28;
    if(fail && SITE_A.includes(u)) dim = .18;
    if(ch.kind==='cover' && u.key) off.y = ({disk:-.1,aggr:-.05,svm:.1,vol:.15,lun:.25,snap:.3,lif:.15,smir:.3}[u.key]||0);
    const hov = !!u.key && hoverK===u.key && mode==='main';
    if(hov && ch.kind!=='unit' && !qa) off.addScaledVector(u.pop,.6);
    // hover 帶一點元件顏色的自發光
    for(const m of u.ems){
      if(hov){ m.emissive.set(U[u.key].color); m.emissiveIntensity = .2; }
      else if(m.userData.lif){ m.emissive.set(U.lif.color); m.emissiveIntensity = .25; }
      else { m.emissive.copy(BLACK); m.emissiveIntensity = 0; }
    }
    u.dim.t = dim; u.off.t.copy(off);
  }
  // 主站台斷線時 node 帶紅色
  nodeMats.forEach(m=>{ if(fail){ m.emissive.copy(RED); m.emissiveIntensity = .35; } });
  // 聚焦某個元件時（元件章、測驗答完）只留它的標籤，其餘標籤收起來，畫面不擁擠
  const fk = ch.kind==='unit' ? ch.k : qa ? QUIZ[quiz.i].k : '';
  document.body.toggleAttribute('data-focus', !!fk || mode==='flow');
  for(const u of MAIN) for(const el of u.labels) el.classList.toggle('focus', mode==='flow' ? st.hl.includes(u.name) : !!fk && (u.key===fk || fk==='smir'&&u===siteB));
  // NVRAM：記錄中的那一份發亮
  const nv = mode==='flow' ? st.nv : [0,0];
  nvMats.forEach((m,j)=>{ m.emissive.set(nv[j]?'#D99A1E':0); m.emissiveIntensity = nv[j]?.8:0; });
  cmpU.forEach(u=>{ u.vis.t = mode==='cmp'?1:0; });

  // 封包
  pk.on = mode==='flow' && st.pk ? 1 : 0;
  if(st.pk){
    const p = new THREE.Vector3(...PKPOS[st.pk]);
    if(!p.equals(pk.to)){ pk.from.copy(pk.pos); pk.to.copy(p); pk.k = reduced?1:0; }
    pkTag.el.querySelector('.in').textContent = st.tag;
  }
}

/* 相機 */
const CAM = {
  cover:{p:[7.3,7.8,16.4],t:[.6,1.9,0],mobile:{scale:1.1,shift:.4}},
  main:{p:[6.9,7.3,15.6],t:[.6,1.9,0],mobile:{scale:1.04,shift:.4,dy:-.6}},
  // 兩個站台一起入鏡的寬景：手機版只拉遠、不平移
  wide:{p:[11.35,11.2,25.9],t:[4.25,1.9,0],mobile:{scale:1.25,shift:0}},
  cmp:{p:[-.6,7.6,24.5],t:[-.6,1.1,.3],mobile:{scale:1.05,shift:0}},
};
function camFor(ch){
  if(ch.kind==='cover') return CAM.cover;
  if(ch.kind==='unit'){
    if(ch.k==='smir') return CAM.wide;
    const f = FOCUS[ch.k], b = CAM.main.t;
    const t = b.map((v,j)=>v+(f[j]-v)*.35);
    const d = CAM.main.p.map((v,j)=>(v-b[j])*.92);
    // 手機版：cluster switch 的標籤在最右側，模型要多往左讓一點；qtree & LUN 的標籤在最左側，反過來往右
    return {p:t.map((v,j)=>v+d[j]),t,mobile:{cluster:{scale:1.3,shift:2.8},lun:{scale:1.05,shift:-.3}}[ch.k]||CAM.main.mobile};
  }
  if(ch.kind==='flow'){
    if(FLOW[fl.step].dr) return CAM.wide;
    const b = CAM.main, f = FLOW_AT[fl.step];
    // 手機版畫面窄，相機往焦點靠會把另一台 node 推出畫面，所以不靠近
    const t = b.t.map((v,j)=>v+(f[j]-v)*(mqMobile.matches?0:.15));
    return {p:t.map((v,j)=>v+(b.p[j]-b.t[j])*.95), t, mobile:b.mobile};
  }
  if(ch.kind==='compare') return CAM.cmp;
  // 測驗答案是 SnapMirror 時，拉成兩個站台都入鏡的寬景
  if(ch.kind==='quiz' && drOn()) return CAM.wide;
  return CAM.main;
}
function camAt(c){
  const p = new THREE.Vector3(...c.p), t = new THREE.Vector3(...c.t);
  // 手機版沒有左側面板，場景寬，所以拉遠相機；標籤多在右側，相機與目標一起稍微右移
  if(mqMobile.matches){
    const m = c.mobile || {scale:1.12, shift:.4};
    p.sub(t).multiplyScalar(m.scale*1.1).add(t);
    // dy：相機與目標一起下移，模型往上讓，前方的用戶端才不會壓到底部的工具列
    p.x += m.shift; t.x += m.shift; p.y += m.dy||0; t.y += m.dy||0;
  } else p.sub(t).multiplyScalar(DESK_ZOOM).add(t);
  // 縮放橫軸：往右放大（相機靠近），往左縮小，範圍 0.5～2 倍距離
  p.sub(t).multiplyScalar(Math.pow(2,-userZoom)).add(t);
  return {p,t};
}
// 相機目標：主迴圈讓相機以指數緩動追上 goal，捲動時 goal 連續變化
const goal = {p:new THREE.Vector3(), t:new THREE.Vector3()};
// 桌面版：依 3D 區域的寬度拉遠相機，讓模型與兩側標籤都放得下（以 1100px 寬為基準）；
// 標籤多在模型右側，所以模型稍微往左偏（偏太多左側的 aggr1 標籤會被裁掉）
let DESK_ZOOM = 1, userZoom = 0;
function applyView(){
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  if(mqMobile.matches) camera.clearViewOffset();
  else {
    // 3D 區越窄，標籤（固定像素大小）占的比例越高，所以拉遠的幅度比寬度比例再多一點
    DESK_ZOOM = Math.pow(Math.max(1, 1100/Math.max(300, w)), 1.15);
    camera.setViewOffset(w,h,Math.round(40*Math.min(1,w/760)),0,w,h);
  }
  camera.updateProjectionMatrix();
}
// 縮放時直接按比例改相機距離，保留使用者轉過的視角
document.getElementById('zoom').addEventListener('input',e=>{
  const dz = DESK_ZOOM;
  document.documentElement.style.setProperty('--z', e.target.value);
  sizeStage(); restoreAnchor();
  const r = Math.pow(2, userZoom - +e.target.value) * DESK_ZOOM/dz; userZoom = +e.target.value;
  camera.position.sub(controls.target).multiplyScalar(r).add(controls.target);
  goal.p.sub(goal.t).multiplyScalar(r).add(goal.t);
  requestRender(); moveHead();
});
let follow = false, spin = false;
function setGoal(p, t, instant){
  goal.p.copy(p); goal.t.copy(t); follow = true;
  if(instant||reduced){ camera.position.copy(p); controls.target.copy(t); }
  requestRender();
}
function flyTo(c, instant){ const g = camAt(c); setGoal(g.p, g.t, instant); }
// 捲動驅動相機：面板 45% 那條線跨過章節交界前後各 1/4 面板高的範圍內，相機從上一章視角過渡到下一章
function scrub(instant){
  const H = panel.clientHeight, y = panel.scrollTop + H*.45, B = H*.5;
  let i = 0; while(i<sections.length-1 && sections[i+1].offsetTop - B/2 <= y) i++;
  const s = i>0 ? Math.min(1,(y - sections[i].offsetTop + B/2)/B) : 1;
  const b = camAt(camFor(CH[i]));
  if(s<1){ const a = camAt(camFor(CH[i-1])), e = ease(s); b.p.lerpVectors(a.p,b.p,e); b.t.lerpVectors(a.t,b.t,e); }
  setGoal(b.p, b.t, instant);
}
// 播放頭：捲動位置對應到兩個刻度之間的連續位置
function moveHead(){
  const y = panel.scrollTop;
  let j = 0; while(j<sections.length-1 && sections[j+1].offsetTop <= y) j++;
  const c = k => tickBtns[k].offsetLeft + tickBtns[k].offsetWidth/2;
  const f = j<sections.length-1 ? Math.min(1,(y-sections[j].offsetTop)/(sections[j+1].offsetTop-sections[j].offsetTop)) : 0;
  head.style.transform = `translateX(${c(j) + (j<sections.length-1 ? f*(c(j+1)-c(j)) : 0)}px)`;
}
controls.addEventListener('start',()=>{ follow = false; });
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

/* ───────────── 章節切換 ───────────── */
const curT = document.getElementById('curT');
let scrollLock = false, lockT = 0;
function go(i, instant, fromScroll){
  i = Math.max(0,Math.min(CH.length-1,i));
  if(i===cur) return;
  cur = i;
  sections.forEach((s,j)=>s.classList.toggle('on',j===i));
  sections[i].classList.add('seen');
  tickBtns.forEach((b,j)=>b.classList.toggle('on',j===i));
  tickBtns[i].scrollIntoView({block:'nearest',inline:'center'});
  if(!fromScroll){
    // 按鈕、鍵盤、網址觸發：捲到該章，捲動期間不讓觀察器改章
    scrollLock = true; clearTimeout(lockT); lockT = setTimeout(()=>scrollLock=false, 1200);
    panel.scrollTo({top:sections[i].offsetTop, behavior:instant||reduced?'instant':'smooth'});
    anchor = {el:sections[i], f:0}; // 捲動事件還沒來之前就先記下目的地
  }
  curT.textContent = `${pad(i)}　${CH[i].t}`;
  history.replaceState(null,'','#'+i);
  const ch = CH[i];
  if(ch.kind==='flow'){ fl.step = fromScroll ? stepAt() : 0; pk.pos.set(...PKPOS.client); pk.from.copy(pk.pos); pk.to.copy(pk.pos); pk.k=1; renderFlow(); }
  if(ch.kind==='quiz') renderQuiz();
  spin = ch.kind==='cover' && !reduced;
  hoverK = '';
  panel.querySelectorAll('.row.hl').forEach(r=>r.classList.remove('hl'));
  // 捲動觸發時相機由 scrub() 處理；按鈕、鍵盤、網址觸發則直接飛到該章視角，不掃過中間各章
  if(!fromScroll) flyTo(camFor(ch), instant);
  computeTargets();
  autoAcc = 0;
}
panel.addEventListener('scrollend',()=>{ scrollLock = false; stepGoal = -1; if(CH[cur].kind==='flow'){ flGo(stepAt()); scrub(); } });
// 版面寬高一變文字就重排，用判定線在哪一章、章內百分之幾來還原捲動位置，避免跳章
let anchor = null;
// 流程章再細到「哪一步」，否則步驟卡高度變了會滑到上一步
function saveAnchor(){
  const y = panel.scrollTop + panel.clientHeight*.45;
  let i = 0; while(i<sections.length-1 && sections[i+1].offsetTop <= y) i++;
  let el = sections[i];
  if(el.contains(fsteps[0]) && topOf(fsteps[0]) <= y){ let j = 0; while(j<fsteps.length-1 && topOf(fsteps[j+1]) <= y) j++; el = fsteps[j]; }
  anchor = {el, f:(panel.scrollTop - topOf(el))/el.offsetHeight};
}
function restoreAnchor(){
  if(!anchor) return;
  const t = topOf(anchor.el), h = anchor.el.offsetHeight, H = panel.clientHeight*.45;
  // 畫面頂端按比例還原，再夾住讓判定線仍落在同一章（同一步）
  // 上下各留 2px：scrollTop 會被取整到裝置像素，剛好落在邊界時會差 1px 跑到上一步
  panel.scrollTop = Math.min(Math.max(t + anchor.f*h, t - H + 2), t + h - H - 2);
}
panel.addEventListener('scroll',()=>{
  saveAnchor();
  if(!scrollLock){ if(CH[cur].kind==='flow') flGo(stepAt()); scrub(); }
  moveHead();
},{passive:true});
// 區塊捲進畫面就開始進場動畫，不必等它成為目前章節
const seenIO = new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting) e.target.classList.add('seen'); },{root:panel, rootMargin:'0px 0px -12% 0px'});
sections.forEach(s=>{ seenIO.observe(s); [...s.firstElementChild.children].forEach((c,j)=>c.style.transitionDelay = Math.min(j,6)*70+'ms'); });
// 捲動瀏覽：面板高度 45% 的那條線落在哪一章，就切到哪一章
const io = new IntersectionObserver(es=>{
  if(scrollLock) return;
  for(const e of es) if(e.isIntersecting) go(+e.target.dataset.i, false, true);
},{root:panel, rootMargin:'-45% 0px -54% 0px'});
sections.forEach(s=>io.observe(s));
// 在模型上滾動滾輪也是捲動章節，所以關掉滾輪縮放
controls.enableZoom = false;
stage.addEventListener('wheel',e=>{ e.preventDefault(); panel.scrollBy({top:e.deltaY*(e.deltaMode===1?16:1)}); },{passive:false});
ticks.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go); });
document.getElementById('bPrev').onclick = ()=>go(cur-1);
document.getElementById('bNext').onclick = ()=>go(cur+1);
document.getElementById('bReset').onclick = ()=>scrub();

// 總覽列：滑過連動模型、點選跳章
panel.addEventListener('click',e=>{
  const r = e.target.closest('.row'); if(r) go(chOf(r.dataset.unit));
});
panel.addEventListener('pointerover',e=>{
  const r = e.target.closest('.row');
  const k = r ? r.dataset.unit : '';
  if(k!==hoverK && CH[cur].kind==='overview'){ hoverK = k; computeTargets(); }
});

/* 流程控制 */
const $ = id => document.getElementById(id);
const fsteps = [...panel.querySelectorAll('.fstep')];
function renderFlow(){
  fsteps.forEach((el,j)=>el.classList.toggle('on',j===fl.step));
  callTag.el.querySelector('.in').innerHTML = `<b>${pad(fl.step+1)}</b>${FLOW[fl.step].t}`;
  callTag.obj.position.set(...FLOW_AT[fl.step]).y += .75;
  if(CH[cur]?.kind==='flow') computeTargets();
}
// 步驟段落在面板捲動內容裡的位置（文字卡有 backdrop-filter，offsetTop 會以卡片為基準，不能直接用）
const topOf = el => el.getBoundingClientRect().top - panel.getBoundingClientRect().top + panel.scrollTop;
// 面板 45% 那條線落在哪一段步驟
function stepAt(){
  const y = panel.scrollTop + panel.clientHeight*.45;
  let j = 0; while(j<fsteps.length-1 && topOf(fsteps[j+1]) <= y) j++;
  return j;
}
function flGo(s){
  s = Math.max(0,Math.min(FLOW.length-1,s));
  if(s===fl.step) return;
  fl.step = s; renderFlow();
}
// 鍵盤、自動播放：捲到某一步
// 平滑捲動途中再按鍵，要從目標步驟往下算，不是從目前步驟
let stepGoal = -1;
function scrollToStep(j){ stepGoal = j; panel.scrollTo({top:topOf(fsteps[j]) - panel.clientHeight*.3, behavior:reduced?'instant':'smooth'}); }

/* 測驗 */
function renderQuiz(){
  const q = QUIZ[quiz.i];
  $('qN').textContent = `情境 ${quiz.i+1} / ${QUIZ.length}`;
  $('qT').textContent = q.q;
  $('qB').querySelectorAll('button').forEach(b=>{ b.disabled=false; b.className=''; });
  $('qF').innerHTML = '';
  $('qS').textContent = quiz.done ? `答對 ${quiz.right} / ${quiz.done}` : '';
  $('qNext').style.visibility = 'hidden';
}
function answer(k){
  if(quiz.answered || CH[cur].kind!=='quiz' || !U[k]) return;
  const q = QUIZ[quiz.i];
  quiz.answered = true; quiz.pick = k; quiz.done++;
  const ok = k===q.k; if(ok) quiz.right++;
  $('qB').querySelectorAll('button').forEach(b=>{
    const v = b.dataset.ans; b.disabled = true;
    if(v===q.k) b.className='right'; else if(v===k) b.className='wrong';
  });
  const d = U[q.k];
  $('qF').innerHTML = ok
    ? `<span class="res ok">答對了｜${d.zh}</span><br>${q.why}`
    : `<span class="res no">不是 ${U[k].zh}</span>，正確答案是 <b>${d.zh}</b>。<br>${q.why}`;
  $('qS').textContent = `答對 ${quiz.right} / ${quiz.done}`;
  $('qNext').style.visibility = 'visible';
  $('qNext').textContent = quiz.i===QUIZ.length-1 ? '從頭再來 ↻' : '下一題 →';
  computeTargets(); flyTo(camFor(CH[cur]));
}
$('qB').addEventListener('click',e=>{ const b=e.target.closest('[data-ans]'); if(b) answer(b.dataset.ans); });
$('qNext').onclick = ()=>{
  if(quiz.i===QUIZ.length-1){ quiz.i=0; quiz.right=0; quiz.done=0; } else quiz.i++;
  quiz.answered=false; quiz.pick=''; renderQuiz(); computeTargets(); flyTo(camFor(CH[cur]));
};

/* 拾取：滑過與點選模型 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
function pickK(e){
  if(modeOf(CH[cur])!=='main') return '';
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits = ray.intersectObjects(pickables,false).filter(h=>h.object.userData.u.vis.c>.5);
  if(!hits.length) return '';
  return hits[0].object.userData.k;
}
// pointermove 只記下位置，射線檢測在主迴圈裡每幀最多做一次
let pendingHover = null;
renderer.domElement.addEventListener('pointermove',e=>{ if(!e.buttons) pendingHover = e; });
function processHover(){
  if(!pendingHover) return;
  const k = pickK(pendingHover); pendingHover = null;
  renderer.domElement.style.cursor = k?'pointer':'grab';
  if(k!==hoverK){ hoverK = k;
    panel.querySelectorAll('.row').forEach(r=>r.classList.toggle('hl',r.dataset.unit===k));
    computeTargets(); }
}
renderer.domElement.addEventListener('pointerleave',()=>{ pendingHover = null; if(hoverK){ hoverK=''; panel.querySelectorAll('.row.hl').forEach(r=>r.classList.remove('hl')); computeTargets(); }});
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt || Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5) return;
  const k = pickK(e); if(!k) return;
  if(CH[cur].kind==='quiz') answer(k); else go(chOf(k));
});

/* 頂部控制 */
const bAuto = $('bAuto');
bAuto.onclick = ()=>{ auto=!auto; autoAcc=0; bAuto.setAttribute('aria-pressed',auto); bAuto.textContent = auto?'Ⅱ 自動播放':'▶ 自動播放'; };
function themeNow(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }
function applyTheme(){
  const dark = themeNow()==='dark';
  const ink = new THREE.Color(dark?'#F2F4F7':'#0A0A0A');
  edgeMats.forEach(m=>m.color.copy(ink));
  const base = new THREE.Color(dark?'#1B2537':'#FFFFFF');
  bodyMats.forEach(b=>b.m.color.copy(b.color).lerp(base, dark? Math.min(.62,b.mix*.85) : b.mix));
  // 玻璃平台的透明度是 unit 的基準值，改 base 再讓 unit 重算
  for(const u of units) for(const p of u.parts) if(glass.includes(p.m)){ p.base = dark?.22:.16; u.dirty = true; }
  groundMat.opacity = dark?.38:.16;
  hemi.groundColor.set(dark?'#2a3446':'#c9cdd3');
  requestRender();
}
$('bTheme').onclick = ()=>{ document.documentElement.dataset.theme = themeNow()==='dark'?'light':'dark'; applyTheme(); };
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
function toggleFull(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
$('bFull').onclick = toggleFull;

addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')) return;
  const k = e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault();
    // 流程章裡 ↓、空白鍵先逐步前進，→ 直接換章
    const st = stepGoal>=0 ? stepGoal : fl.step;
    if(CH[cur].kind==='flow' && k!=='ArrowRight' && st<FLOW.length-1) scrollToStep(st+1); else go(cur+1); }
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){ e.preventDefault();
    const st = stepGoal>=0 ? stepGoal : fl.step;
    if(CH[cur].kind==='flow' && k!=='ArrowLeft' && st>0) scrollToStep(st-1); else go(cur-1); }
  else if(k==='f'||k==='F') toggleFull();
  else if(k==='Home') go(0);
  else if(k==='End') go(CH.length-1);
  else if(CH[cur].kind==='quiz' && /^[0-9]$/.test(k)) answer(KEYS[(+k+9)%10]);
});

/* 尺寸 */
function sizeStage(){
  const r = stage.getBoundingClientRect();
  const w = Math.max(1,r.width), h = Math.max(1,r.height);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h); labelR.setSize(w,h);
  camera.aspect = w/h;
  applyView();
}
function resize(){
  sizeStage(); restoreAnchor();
  if(cur>=0) scrub(true);
  requestRender();
  moveHead();
}
addEventListener('resize',resize);
addEventListener('hashchange',()=>{ const n = parseInt(location.hash.slice(1)); if(Number.isFinite(n)) go(n); });
mqMobile.addEventListener('change',()=>{ resize(); scrub(true); moveHead(); });

/* ───────────── 主迴圈 ───────────── */
// 按需重繪：畫面靜止時跳過 WebGL 與標籤的繪製，狀態邏輯（自動播放、流程步進）照常每幀執行
let wake = 2;
function requestRender(){ wake = Math.max(wake,2); }
controls.addEventListener('change',requestRender);
const EPS = 1e-3;
function setLabel(el, o, vis){
  if(el._o!==o){ el._o = o; el.style.opacity = o; }
  if(el._v!==vis){ el._v = vis; el.style.visibility = vis; }
}
// 步驟卡超出畫面邊緣時往內推（手機版畫面窄，卡片常落在邊緣）
const callIn = callTag.el.querySelector('.in');
let cdx = 0, cdy = 0;
function keepCallIn(){
  const r = callIn.getBoundingClientRect(), s = stage.getBoundingClientRect(), m = 8;
  const l = r.left-cdx, rt = r.right-cdx, t = r.top-cdy;
  const dx = l<s.left+m ? s.left+m-l : rt>s.right-m ? s.right-m-rt : 0;
  let dy = t<s.top+m ? s.top+m-t : 0;
  // 步驟卡蓋到其他看得見的標籤就往上讓（讓開一個可能又碰到上一個，所以由下往上依序檢查），但不超出 3D 區頂端
  const b = r.bottom-cdy;
  const others = [...labelR.domElement.querySelectorAll('.lbl:not(.call) .in')]
    .filter(e=>{ const cs = getComputedStyle(e.parentNode); return cs.visibility!=='hidden' && +cs.opacity>=.5 && e.offsetWidth; })
    .map(e=>e.getBoundingClientRect()).sort((p,q)=>q.top-p.top);
  for(const wr of others) if(l+dx<wr.right && rt+dx>wr.left && t+dy<wr.bottom && b+dy>wr.top) dy = Math.max(s.top+m-t, wr.top-4-b);
  if(Math.abs(dx-cdx)>.5){ cdx = dx; callIn.style.setProperty('--dx',dx+'px'); }
  if(Math.abs(dy-cdy)>.5){ cdy = dy; callIn.style.setProperty('--dy',dy+'px'); }
}
const clock = new THREE.Clock();
const progress = $('progress');
function tick(){
  // dt 上限 0.25 秒讓轉場在低幀率下不會一次跳完；自動播放計時改用實際經過時間（上限 1 秒），低幀率時也照秒數換章
  const raw = clock.getDelta(), dt = Math.min(raw,.25), t = clock.elapsedTime;
  const k = reduced ? 1 : 1-Math.exp(-dt*6);

  if(follow){
    const kc = reduced ? 1 : 1-Math.exp(-dt*4);
    camera.position.lerp(goal.p,kc); controls.target.lerp(goal.t,kc);
    if(camera.position.distanceToSquared(goal.p)<1e-6 && controls.target.distanceToSquared(goal.t)<1e-6){
      camera.position.copy(goal.p); controls.target.copy(goal.t); follow = false; }
  }
  processHover();
  let active = follow;
  // 封面自轉只在相機追上目標後才開始，否則會和捲動驅動的相機互相拉扯
  controls.autoRotate = spin && !follow;
  if(controls.update()) active = true;
  if(controls.autoRotate) active = true;

  for(const u of units){
    const moving = Math.abs(u.vis.t-u.vis.c)>EPS || Math.abs(u.dim.t-u.dim.c)>EPS || u.off.c.distanceToSquared(u.off.t)>EPS*EPS;
    if(!moving && !u.dirty) continue;
    if(moving){
      u.vis.c += (u.vis.t-u.vis.c)*k;
      u.dim.c += (u.dim.t-u.dim.c)*k;
      u.off.c.lerp(u.off.t,k);
      active = true; u.dirty = true;
    } else { u.vis.c = u.vis.t; u.dim.c = u.dim.t; u.off.c.copy(u.off.t); u.dirty = false; }
    u.root.position.copy(u.home).add(u.off.c);
    const a = u.vis.c*u.dim.c;
    u.root.visible = u.vis.c>.01;
    for(const p of u.parts){
      p.m.opacity = p.base*a; p.m.depthWrite = p.base*a>.6;
      // 完全不透明時改走不透明渲染流程，深度排序正確
      const tr = p.base*a < .999;
      if(tr!==p.tr){ p.tr = tr; p.m.transparent = tr; p.m.needsUpdate = true; }
    }
    // 變淡的物件不投影，否則地面陰影會透過半透明物件形成一大塊灰
    const cast = a>.6;
    if(cast!==u.cast){ u.cast = cast; for(const m of u.casters) m.castShadow = cast; }
    for(const el of u.labels) setLabel(el, +(u.vis.c*(.3+.7*u.dim.c)).toFixed(3), u.vis.c<.03?'hidden':'visible');
  }

  // 流程章的狀態標籤
  const flowOn = CH[cur]?.kind==='flow', st = FLOW[fl.step];
  setLabel(failTag.el, 1, flowOn && st.fail ? 'visible':'hidden');
  setLabel(brkTag.el, 1, flowOn && st.brk ? 'visible':'hidden');
  setLabel(callTag.el, 1, flowOn ? 'visible':'hidden');

  // 封包：沿弧線飛向目標
  packet.visible = pk.on>0;
  setLabel(pkTag.el, 1, packet.visible?'visible':'hidden');
  if(packet.visible){
    active = true;
    pk.k = Math.min(1, pk.k + dt/.9);
    const e = ease(pk.k);
    pk.pos.lerpVectors(pk.from,pk.to,e);
    pk.pos.y += Math.sin(Math.PI*pk.k)*1.1;
    packet.position.copy(pk.pos);
    packet.position.y += Math.sin(t*2.2)*.04;
    pkMesh.rotation.y = t*.8;
  }


  // 自動播放章節
  if(auto){
    const ch = CH[cur];
    autoAcc += Math.min(raw,1);
    const need = ch.kind==='flow'?3:8;
    progress.style.width = Math.min(1,autoAcc/need)*100+'%';
    if(autoAcc>need){
      // 流程章：一步一步捲下去，最後一步之後才換章
      if(ch.kind==='flow' && fl.step<FLOW.length-1){ autoAcc = 0; scrollToStep(fl.step+1); }
      else if(cur>=CH.length-2){ go(cur+1); bAuto.click(); progress.style.width='0'; }
      else go(cur+1);
    }
  } else progress.style.width = '0';

  if(active || wake>0){
    renderer.render(scene,camera);
    labelR.render(scene,camera);
    if(flowOn) keepCallIn();
    if(wake>0) wake--;
  }
  requestAnimationFrame(tick);
}

/* 啟動 */
applyTheme();
resize();
const start = parseInt(location.hash.slice(1));
go(Number.isFinite(start)?start:0, true);
moveHead();
units.forEach(u=>{ u.vis.c=u.vis.t; u.dim.c=u.dim.t; u.off.c.copy(u.off.t); u.dirty=true; });
pk.pos.copy(pk.to); pk.k = 1;
tick();
</script>
